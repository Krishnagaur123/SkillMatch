services:

  postgres:
    image: postgres:16
    container_name: skillmatch-postgres

    # Development-only credentials.
    # Production credentials are supplied through environment variables/secrets.
    environment:
      POSTGRES_DB: skillmatch
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - skillmatch_postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d skillmatch"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - skillmatch-network

  redis:
    image: redis:7-alpine
    container_name: skillmatch-redis

    command:
      - redis-server
      - --maxmemory
      - 30mb
      - --maxmemory-policy
      - allkeys-lru

    ports:
      - "127.0.0.1:6379:6379"

    restart: unless-stopped

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - skillmatch-network


  backend:
    build:
      context: ./backend

    container_name: skillmatch-backend

    env_file:
      - ./backend/.env

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - skillmatch-network

    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s


volumes:
  skillmatch_postgres_data:


networks:
  skillmatch-network: