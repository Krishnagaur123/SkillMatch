spring.application.name=skillmatch

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration-ms=2592000000

app.auth.redirect-url=${AUTH_REDIRECT_URL:http://localhost:3000/auth/callback}
app.cookie.secure=${COOKIE_SECURE:false}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

app.resume.storage-path=${RESUME_STORAGE_PATH}
app.resume.max-file-size-mb=10

app.avatar.storage-path=${AVATAR_STORAGE_PATH}
app.avatar.max-file-size-mb=5


spring.web.resources.add-mappings=false
server.error.whitelabel.enabled=false
server.error.include-message=always

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never