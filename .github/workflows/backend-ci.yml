name: Backend CI Pipeline

on:
  push:
    paths:
      - backend/**
      - .github/workflows/backend-ci.yml

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: skillmatch
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d skillmatch"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_URL: ${{ secrets.DB_URL }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      COOKIE_SECURE: ${{ secrets.COOKIE_SECURE }}
      CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
      AUTH_REDIRECT_URL: ${{ secrets.AUTH_REDIRECT_URL }}
    steps:
      - name: clone/download Repository
        uses: actions/checkout@v4

      - name: Setup Java and cache maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Debug Database Configuration
        run: |
          echo "DB_URL=$DB_URL"
          echo "DB_USERNAME=$DB_USERNAME"

      - name: Build Backend
        working-directory: backend
        run: mvn clean verify

      - name: Upload Backend JAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar

  docker:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: clone/download Repository
        uses: actions/checkout@v4

      - name: download jre(artifact)
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target

      - name: login to dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image for backend
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/skillmatch:latest \
            backend    

      - name: Push Docker Image
        run: |
          docker push \
            ${{ secrets.DOCKER_USERNAME }}/skillmatch:latest